name: Langfuse ClickHouse → BigQuery Pipeline

on:
  # Run on every push to main (prod) and development (dev) branches
  push:
    branches:
      - main
      - development

  # Allow manual trigger from GitHub Actions UI with branch selection
  workflow_dispatch:

  # Scheduled run every day on main branch only
  schedule:
    - cron: "30 20 * * *"

jobs:
  run-pipeline:
    name: Run pipeline (${{ github.ref_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Create dlt config file
        # Writes non-secret config from GitHub Variables into .dlt/config.toml
        run: |
          mkdir -p .dlt
          cat > .dlt/config.toml << EOF
          [sources.langfuse_clickhouse_source]
          host     = "${{ vars.CLICKHOUSE_HOST }}"
          port     = ${{ vars.CLICKHOUSE_PORT }}
          database = "${{ vars.CLICKHOUSE_DATABASE }}"
          EOF

      - name: Create dlt secrets file
        # Writes credentials from GitHub Secrets into .dlt/secrets.toml
        run: |
          cat > .dlt/secrets.toml << EOF
          [sources.langfuse_clickhouse_source]
          username = "${{ secrets.CLICKHOUSE_USERNAME }}"
          password = "${{ secrets.CLICKHOUSE_PASSWORD }}"

          [destination.bigquery.credentials]
          project_id   = "${{ secrets.BIGQUERY_PROJECT_ID }}"
          client_email = "${{ secrets.BIGQUERY_CLIENT_EMAIL }}"
          private_key  = "${{ secrets.BIGQUERY_PRIVATE_KEY }}"
          EOF

      - name: Run pipeline
        # GITHUB_REF_NAME is set automatically by GitHub Actions to the branch
        # name — utils.get_params() uses it to select dev vs prod environment
        run: uv run python clickhouse_bigquery_pipeline.py

      - name: Upload dlt pipeline state (for incremental cursor persistence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dlt-pipeline-state-${{ github.ref_name }}
          path: .dlt/pipelines/
          retention-days: 7
