[project]
name = "clickhouse-bigquery-pipeline"
version = "0.1.0"
description = "Incrementally loads Langfuse traces and scores from ClickHouse into BigQuery"
requires-python = ">=3.13"
dependencies = [
    "clickhouse-connect>=0.7.0",
    "dlt[bigquery]>=1.0.0",
    "google-cloud-bigquery-storage>=2.39.0",
    "psutil>=7.2.2",
    "slack-sdk>=3.42.0"
]
